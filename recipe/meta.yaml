{% set name = "pyopensky" %}
{% set version = "2.17" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyopensky-{{ version }}.tar.gz
  sha256: c54b141436775e7053056c1f56203ac597ccdec30b061c55bf5914bcbf7c21f4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2.0.2
    - pandas >=2.2.2
    - trino-python-client >=0.329
    - minio >=7.2.8
    - appdirs >=1.4.4
    - tqdm >=4.66.5
    - pyarrow >=17.0.0
    - typing-extensions >=4.12.2
    - pyjwt >=2.9.0
    - sqlalchemy >=1.3
    - httpx >=0.27.2
    - python-dotenv >=1.0.1
    - stamina >=25.1.0
    - python-tzdata >=2024.2

test:
  imports:
    - pyopensky
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/open-aviation/pyopensky
  summary: A Python interface for OpenSky database
  license: LGPL-3.0-or-later
  license_file: license.txt

extra:
  recipe-maintainers:
    - xoolive
